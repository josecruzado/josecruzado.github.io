# Publicación en GitHub Pages.
#
# Reutiliza build.yml para que lo que se despliega pase exactamente por las
# mismas comprobaciones que un pull request.
name: Deploy

on:
  push:
    branches: ['develop']
  workflow_dispatch:

# Mínimo privilegio: los permisos de Pages se conceden solo al job que los
# necesita. Antes estaban a nivel de workflow y los heredaban también los
# jobs de calidad, que no publican nada.
permissions:
  contents: read

concurrency:
  # Sin cancelación: interrumpir un despliegue a medias puede dejar Pages en
  # un estado intermedio. Las ejecuciones se encolan.
  group: pages
  cancel-in-progress: false

jobs:
  # El nombre del job invocador se antepone al del job invocado para formar
  # el nombre del check: aquí "Compilación / Calidad y build". Llamarlo
  # "Calidad y build" producía "Calidad y build / Calidad y build".
  #
  # Tiene que ser además DISTINTO del de ci.yml ("Calidad"): si ambos
  # workflows emitieran el mismo contexto, la protección de rama no podría
  # distinguir cuál lo satisface.
  build:
    name: Compilación
    uses: ./.github/workflows/build.yml
    with:
      upload-pages-artifact: true

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
